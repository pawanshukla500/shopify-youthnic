name: shopify-oms-base44

services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: shopify
      POSTGRES_PASSWORD: shopify_dev
      POSTGRES_DB: shopify
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopify -d shopify"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://shopify:shopify_dev@db:5432/shopify
      PORT: "3000"
      NODE_ENV: development
      BASE44_PREVIEW_MODE: "1"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        apk add --no-cache openssl libc6-compat
        npm ci
        npx prisma generate
        npx prisma db push --accept-data-loss
        exec npx tsx watch src/index.ts
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 90s

  web:
    image: node:22-alpine
    restart: on-failure
    working_dir: /app/frontend
    volumes:
      - ./:/app
      - frontend_node_modules:/app/frontend/node_modules
    environment:
      VITE_PROXY_TARGET: http://api:3000
      BASE44_PREVIEW_MODE: "1"
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS:
    ports:
      - "3000:5173"
    depends_on:
      api:
        condition: service_healthy
    command:
      - sh
      - -ec
      - |
        npm ci
        exec npx vite --host 0.0.0.0 --port 5173
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pgdata:
  api_node_modules:
  frontend_node_modules:
