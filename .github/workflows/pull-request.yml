name: PR Validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'feature/**'
      - 'fix/**'

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Root & Backend Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Backend Unit Tests
        run: npm test

      - name: Build TypeScript Backend
        run: npm run build

      - name: Install Frontend Dependencies
        run: cd frontend && npm ci

      - name: Build Vite React Frontend
        run: cd frontend && npm run build

      - name: Setup Python for Browser Verification
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Browser Test Tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium

      - name: Verify Order Workspace Interactions
        env:
          ORDER_UI_ARTIFACT_DIR: ${{ runner.temp }}/order-workspace
        run: |
          python tests/browser/order_detail.py
          python tests/browser/order_workspace.py
          python tests/browser/payments_pickup.py

      - name: Upload Order Workspace Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order-workspace-ui
          path: ${{ runner.temp }}/order-workspace
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Production Docker Builder
        run: docker build --target builder --tag youthnic-oms-pr-builder .
